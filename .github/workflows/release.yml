name: Publicar versão

# Publicação de versão estável ou rc: Actions -> "Publicar versão" -> Run workflow -> versão (ex.: 0.0.1 ou 1.0.0).
# Roda convenções, pack, testes unitários com cobertura e CodeQL em paralelo; só então tag, Release e GitHub Packages.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 0.0.1 ou 1.0.0)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publicar-versao
  cancel-in-progress: false

jobs:
  release:
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-release.yml@v1
    permissions:
      contents: write          # tag e Release
      packages: write          # push no feed NuGet do GitHub
      actions: read            # CodeQL
      checks: read             # portão ci-ok da execução mais recente
      pull-requests: read      # portão que bloqueia PRs abertos
      security-events: write   # CodeQL
      id-token: write          # teto exigido pelo dotnet-test.yml
      attestations: write      # atestação SLSA de proveniência dos pacotes no job release
    with:
      version: ${{ inputs.versao }}
      solution: TEC.Http.slnx
      private-feed: true
      unit-tests: TEC.Http.Tests
